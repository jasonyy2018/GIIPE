# Upstream servers
# Note: Using variables in proxy_pass instead of upstream blocks
# to prevent DNS resolution errors at startup
# Resolver is configured in nginx.conf for dynamic DNS resolution

# HTTP server (redirects to HTTPS in production)
server {
    listen 80;
    listen [::]:80;
    server_name _ 156.238.249.53 giip.info www.giip.info;
    
    # Health check endpoint (allow without redirect)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Let's Encrypt challenge (must be accessible via HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Upload endpoint - proxy to backend /api/storage/upload with extended timeouts
    location /api/upload {
        client_max_body_size 10M;
        limit_req zone=upload burst=2 nodelay;
        
        # Directly proxy to backend with URI rewrite
        # No need for rewrite directive - proxy_pass handles it
        set $backend_upstream "http://backend:3001";
        proxy_pass $backend_upstream/api/storage/upload$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for file uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Disable buffering for uploads
        proxy_request_buffering off;
        proxy_buffering off;
    }
    
    # Next.js API routes (must come before /api/ to handle frontend API routes)
    location ~ ^/api/admin {
        set $frontend_upstream "http://frontend:3000";
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Specific auth routes handled by Next.js
    location ~ ^/api/auth/(login|register|logout|refresh) {
        set $frontend_upstream "http://frontend:3000";
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Events API - exclude from rate limiting for better UX (read-only, cached)
    location /api/events/ {
        # No rate limiting - events API is read-only and cached, safe to allow unlimited access
        
        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
        proxy_cache_bypass $http_upgrade $http_pragma $http_authorization;
        proxy_no_cache $http_upgrade $http_pragma $http_authorization;
        
        set $backend_upstream "http://backend:3001";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Backend API routes (all other /api/ paths)
    # Note: /api/uploads/ is handled above with higher priority
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
        proxy_cache_bypass $http_upgrade $http_pragma $http_authorization;
        proxy_no_cache $http_upgrade $http_pragma $http_authorization;
        
        set $backend_upstream "http://backend:3001";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Authentication endpoints with stricter rate limiting
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        
        set $backend_upstream "http://backend:3001";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # File upload endpoints
    location /api/storage/ {
        limit_req zone=upload burst=2 nodelay;
        client_max_body_size 10M;
        
        set $backend_upstream "http://backend:3001";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        
        proxy_request_buffering off;
        proxy_buffering off;
    }
    
    # Static file serving for /api/uploads/ - exclude from rate limiting
    # Use ^~ prefix to ensure this location takes priority over /api/
    location ^~ /api/uploads/ {
        # No rate limiting for static file downloads - CRITICAL: Must be excluded
        
        set $backend_upstream "http://backend:3001";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache api_cache;
        proxy_cache_valid 200 1y;
        proxy_cache_valid 404 1m;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        access_log off;
    }
    
    # Static file serving for /uploads/ (legacy path)
    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        
        location ~* \.(jpg|jpeg|png|gif|ico|svg|pdf|doc|docx|txt)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }
    }
    
    # Handle missing CSS files (from browser extensions) - return empty CSS
    # This prevents MIME type errors when browser extensions try to load CSS files
    location /css/ {
        access_log off;
        add_header Content-Type text/css;
        return 200 "";
    }
    
    # Next.js static files - must be before other location blocks
    # This handles /_next/static/chunks/ and other Next.js assets
    location /_next/ {
        # Static files are excluded from connection limiting
        # By not setting limit_conn here, browsers can load multiple chunks simultaneously
        
        set $frontend_upstream "http://frontend:3000";
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for static files
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Error handling - enable logging for debugging
        proxy_intercept_errors off;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        # Timeout must allow for retries: 30s * 2 tries = 60s minimum
        proxy_next_upstream_timeout 90s;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Enable access log for debugging 503 errors
        access_log /var/log/nginx/access.log main;
    }
    
    # Next.js images
    location /_next/image {
        # Image optimization excluded from connection limiting
        
        set $frontend_upstream "http://frontend:3000";
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Error handling - enable logging for debugging
        proxy_intercept_errors off;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        # Timeout must allow for retries: 30s * 2 tries = 60s minimum
        proxy_next_upstream_timeout 90s;
        
        # Cache configuration - must specify proxy_cache before other cache directives
        proxy_cache api_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        # Enable access log for debugging 503 errors
        access_log /var/log/nginx/access.log main;
    }
    
    # Static assets from Next.js public folder (images, fonts, etc.)
    # This must come after /_next/ to avoid conflicts
    # Includes verification files (*.txt) for domain verification (e.g., Tencent, WeChat)
    location ~* ^/(images|fonts|favicon\.ico|robots\.txt|sitemap\.xml|.*\.txt) {
        # Static assets excluded from connection limiting
        
        set $frontend_upstream "http://frontend:3000";
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for static assets
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Error handling
        proxy_intercept_errors off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        # Timeout must allow for retries: 30s * 2 tries = 60s minimum
        proxy_next_upstream_timeout 90s;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Frontend application - serve all requests directly (no HTTPS redirect for now)
    location / {
        # Apply connection limiting only to dynamic pages, not static resources
        limit_conn conn_limit_per_ip 50;
        
        set $frontend_upstream "http://frontend:3000";
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increased timeouts for Next.js SSR and heavy pages (504 = upstream didn't respond in time)
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        
        # Better error handling - don't intercept errors, let Next.js handle them
        proxy_intercept_errors off;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 400s;
        
        # Enable access log for debugging 503 errors
        access_log /var/log/nginx/access.log main;
        
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}

# HTTPS server (disabled - SSL certificates not configured)
# To enable HTTPS:
# 1. Get SSL certificates: bash setup-ssl-cert.sh
# 2. Uncomment the HTTPS server block below
# 3. Restart Nginx: docker-compose -f docker-compose.prod.yml restart nginx
#
# See CONFIGURE_NGINX_HTTPS.md for detailed instructions