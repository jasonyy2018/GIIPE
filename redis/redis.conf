# Redis configuration file
# Generated for production deployment

# Memory limit
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (RDB)
save 900 1
save 300 10
save 60 10000

# Network
bind 0.0.0.0
protected-mode yes
port 6379

# Logging
loglevel notice

# Other settings
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Note: requirepass is set via command line argument to support environment variable

